name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: Lint (ruff, mypy, import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Ruff check
        run: uv run ruff check omniagent tests scripts

      - name: Ruff format check
        run: uv run ruff format --check omniagent tests scripts

      - name: mypy
        run: uv run mypy omniagent/kernel omniagent/agents omniagent/channels omniagent/adapters omniagent/memory omniagent/eval

      - name: import-linter
        run: uv run lint-imports

  test:
    name: Fast tests (unit, contract, component, perf)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run fast test tiers
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/unit tests/contract tests/component tests/perf \
            -n auto --dist=loadgroup --tb=long -rA \
            --cov=omniagent --cov-report=term-missing --cov-report=xml \
            2>&1 | tee pytest_output.log

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

      # Temporary diagnostic: the runner's own job logs aren't downloadable
      # without an authenticated admin token, so on failure this posts the
      # tail of pytest's own output as a separate check run, whose `output`
      # field the public unauthenticated API does expose. Remove once the
      # current CI failure is root-caused.
      - name: Publish failure detail as a check run
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          with open("pytest_output.log", "rb") as f:
              tail = f.read()[-60000:].decode("utf-8", errors="replace")

          payload = json.dumps(
              {
                  "name": "Fast tests failure detail",
                  "head_sha": os.environ["GITHUB_SHA"],
                  "status": "completed",
                  "conclusion": "neutral",
                  "output": {"title": "pytest output tail", "summary": "See text", "text": tail},
              }
          ).encode("utf-8")

          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"token {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.status)
          PY
        env:
          GITHUB_TOKEN: ${{ github.token }}

  integration:
    name: Integration and e2e tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run integration and e2e tests
        run: uv run pytest tests/integration tests/e2e -n auto --dist=loadgroup --tb=short --no-cov
