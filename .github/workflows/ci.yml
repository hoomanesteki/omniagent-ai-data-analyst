name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: Lint (ruff, mypy, import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Ruff check
        run: uv run ruff check omniagent tests scripts

      - name: Ruff format check
        run: uv run ruff format --check omniagent tests scripts

      - name: mypy
        run: uv run mypy omniagent/kernel omniagent/agents omniagent/channels omniagent/adapters omniagent/memory omniagent/eval

      - name: import-linter
        run: uv run lint-imports

  test:
    name: Fast tests (unit, contract, component, perf)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run fast test tiers
        run: >-
          uv run pytest tests/unit tests/contract tests/component tests/perf
          -n auto --dist=loadgroup --tb=short --junitxml=junit.xml
          --cov=omniagent --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

      # Temporary diagnostic: the runner's own job logs aren't downloadable
      # without an authenticated admin token, so this publishes failing test
      # names/tracebacks as check-run annotations instead, which the public
      # API does expose. Remove once the current CI failure is root-caused.
      - name: Publish failing test annotations
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: junit.xml
          require_tests: false
          annotate_only: true

  integration:
    name: Integration and e2e tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run integration and e2e tests
        run: uv run pytest tests/integration tests/e2e -n auto --dist=loadgroup --tb=short --no-cov
